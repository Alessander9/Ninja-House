<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Ring Mat / Canvas (Azul Eléctrico) -->
  <rect x="12" y="12" width="40" height="40" rx="3" fill="#078BFF" stroke="#000000" stroke-width="3.8"/>

  <!-- Outer Ropes (Amarillo Intenso) -->
  <rect x="16" y="16" width="32" height="32" rx="2" fill="none" stroke="#FFD000" stroke-width="2.8"/>

  <!-- Inner Ropes (Amarillo Intenso) -->
  <rect x="20" y="20" width="24" height="24" rx="1.5" fill="none" stroke="#FFD000" stroke-width="2.2"/>

  <!-- Center Ring Logo Decal -->
  <circle cx="32" cy="32" r="5.5" fill="#FFD000" stroke="#000000" stroke-width="2"/>
  <path d="M32 28V36M28 32H36" stroke="#078BFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 4 Corner Turnbuckles (Postes y Almohadillas) -->
  <!-- Top Left -->
  <circle cx="12" cy="12" r="5.5" fill="#FFD000" stroke="#000000" stroke-width="3"/>
  <circle cx="12" cy="12" r="2" fill="#078BFF"/>
  <!-- Top Right -->
  <circle cx="52" cy="12" r="5.5" fill="#FFD000" stroke="#000000" stroke-width="3"/>
  <circle cx="52" cy="12" r="2" fill="#078BFF"/>
  <!-- Bottom Left -->
  <circle cx="12" cy="52" r="5.5" fill="#FFD000" stroke="#000000" stroke-width="3"/>
  <circle cx="12" cy="52" r="2" fill="#078BFF"/>
  <!-- Bottom Right -->
  <circle cx="52" cy="52" r="5.5" fill="#FFD000" stroke="#000000" stroke-width="3"/>
  <circle cx="52" cy="52" r="2" fill="#078BFF"/>
</svg>
